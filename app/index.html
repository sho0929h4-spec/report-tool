<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>今日 — 現場管理</title>
<link rel="stylesheet" href="shared/style.css">
<meta name="theme-color" content="#16304d">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>
<body>
<header class="app"><h1 id="hd">今日</h1><span class="sub" id="who"></span></header>
<main id="main"><div class="empty">読み込み中…</div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="shared/config.js"></script>
<script src="shared/calc.js"></script>
<script src="shared/store.js"></script>
<script src="shared/ui.js"></script>
<script>
(async () => {
  await Store.init();
  const s = Store.session();
  document.getElementById('hd').textContent = `今日 ${UI.fmtDate(new Date().toISOString())}`;
  document.getElementById('who').textContent = `${s.name}（${s.role === 'admin' ? '管理者' : '作業担当'}）`;

  const all = await Store.listCases();
  const { todays, overdue, awaiting } = await Store.getToday();
  let stalled = await Store.listStalledTasks(24);
  let escalated = s.role === 'admin' ? await Store.listEscalated() : [];
  let unackedReports = s.role === 'admin' ? await Store.listUnackedSiteReports() : [];
  if (s.role === 'worker') stalled = stalled.filter(t => t.assignee === s.userId);
  const overdueCases = overdue.filter(c => c.status !== 'submitted'); // submittedは承認待ち行に統合

  /* --- 要対応（例外ファースト） --- */
  const SR_KIND_LABEL = {
    survey: '追加調査が必要', policy: '方針変更の提案',
    arrange: '部材・業者の手配が必要', resident: '入居者対応の相談', other: 'その他',
  };
  const siteReportRow = r => {
    const d = new Date(r.createdAt);
    const timeStr = `${d.getHours()}:${String(d.getMinutes()).padStart(2,'0')}`;
    const itemsStr = r.items && r.items.length ? r.items.map(i => UI.esc(i)).join('・') : '';
    const noteStr = r.note ? `「${UI.esc(r.note)}」` : '';
    const detail = [itemsStr, noteStr].filter(Boolean).join(' ／ ');
    return `
    <a class="cardlink" href="case.html?id=${r.caseId}"><div class="card attn tappable">
      <div class="row between">
        <span class="title">現地報告 ・ ${UI.esc(r.propertyName)} ${UI.esc(r.roomNo)}</span>
        <span class="badge submitted" style="font-size:12px">${UI.esc(SR_KIND_LABEL[r.kind] || r.kind)}</span>
      </div>
      ${detail ? `<div class="sub" style="margin-top:4px">${detail}</div>` : ''}
      <div class="sub" style="margin-top:2px">${UI.esc(r.byName)} ・ ${UI.esc(timeStr)}</div>
    </div></a>`;
  };
  const stallRow = t => {
    const st = UI.TASK_STATUS[t.status] || t.status;
    const stalled = t.stallH != null && t.stallH >= 24;
    const line = stalled
      ? `<b>${UI.esc(t.assigneeName)}</b>で<b>${t.stallH}時間</b>停止（${UI.esc(t.stallReason || st)}）`
      : `期限 ${UI.fmtDate(t.dueAt)} ${UI.fmtTime(t.dueAt)} を超過（担当 ${UI.esc(t.assigneeName)}・${st}）`;
    return `
    <a class="cardlink" href="case.html?id=${t.caseId}&tab=tasks"><div class="card attn tappable">
      <div class="row between"><span class="title">🛑 ${UI.esc(t.propertyName)} ${UI.esc(t.roomNo)}</span>
        ${t.overdue ? '<span class="due-danger">期限超過</span>' : ''}</div>
      <div class="sub" style="margin-top:4px">${UI.esc(t.title)}</div>
      <div class="sub" style="margin-top:2px">${line}</div>
    </div></a>`;
  };
  const awaitRow = c => `
    <a class="cardlink" href="case.html?id=${c.id}"><div class="card attn y tappable">
      <div class="row between"><span class="title">📝 承認待ち｜${UI.esc(c.propertyName)} ${UI.esc(c.roomNo)}</span>
        ${c.dueDate && c.dueDate < new Date().toISOString().slice(0,10) ? '<span class="due-danger">期限超過</span>' : ''}</div>
      <div class="sub" style="margin-top:4px">報告提出済み — タップして内容を確認</div>
    </div></a>`;
  const overdueRow = c => `
    <a class="cardlink" href="case.html?id=${c.id}"><div class="card attn tappable">
      <div class="row between"><span class="title">⚠ 期限超過｜${UI.esc(c.propertyName)} ${UI.esc(c.roomNo)}</span>
        ${UI.statusBadge(c.status)}</div>
      <div class="sub" style="margin-top:4px">期限 ${UI.esc(c.dueDate)}・担当 ${UI.esc(c.assignedName)}</div>
    </div></a>`;
  const qRow = (q, i) => `
    <div class="card attn q tappable" data-q="${i}">
      <div class="title">💬 要回答「${UI.esc(q.q)}」</div>
      <div class="sub" style="margin-top:4px">${UI.esc(q.propertyName)} ${UI.esc(q.roomNo)}・AIが回答できず待機中</div>
      <div class="qa-form" id="qf-${i}" hidden>
        <div class="field" style="margin:10px 0 8px"><textarea id="qt-${i}" rows="2"
          placeholder="回答を入力（共有ページに表示されます）"></textarea></div>
        <button class="btn primary" data-send="${i}">回答を送信</button>
      </div>
    </div>`;

  /* --- 今日の現場カード --- */
  const caseCard = c => {
    const mv = c.movement;
    const isMoving = mv && c.status === 'scheduled';
    let movingLine = '';
    if (isMoving) {
      const etaStr = UI.fmtTime(mv.etaAt);
      const departStr = UI.fmtTime(mv.departedAt);
      const diffMin = c.scheduledAt
        ? Math.round((new Date(mv.etaAt) - new Date(c.scheduledAt)) / 60000) : 0;
      const delayHtml = diffMin > 0
        ? `<span style="color:var(--danger)">${diffMin}分遅れ</span>`
        : '<span style="color:var(--ok)">予定どおり</span>';
      const reasonPart = (diffMin > 0 && mv.delayReason)
        ? `・<span style="color:var(--danger)">${UI.esc(mv.delayReason)}</span>` : '';
      movingLine = `<div class="sub" style="margin-top:4px;font-weight:700">到着予定 ${etaStr}（${delayHtml}${reasonPart}）・ ${departStr} 出発</div>`;
    }
    const unassignedBadge = c.assignedTo === null
      ? ' <span class="badge unassigned">担当者未定</span>' : '';
    return `
    <a class="cardlink" href="case.html?id=${c.id}"><div class="card tappable">
      <div class="row between">
        <span class="title">${UI.esc(c.propertyName)} ${UI.esc(c.roomNo)}${isMoving ? ' <span class="badge in_progress">移動中</span>' : ''}${unassignedBadge}</span>
        ${UI.statusBadge(c.status)}
      </div>
      <div class="sub">${UI.esc(c.address)}</div>
      ${movingLine}
      <div class="row" style="margin-top:6px">
        <span class="sub">🕐 ${UI.fmtTime(c.scheduledAt)}</span>
        <span class="badge type">${UI.esc(c.workType)}</span>
        <span class="sub">👤 ${UI.esc(c.assignedName || '未定')}</span>
        <span class="sub">☑ ${c.tasks.filter(t => t.status === 'done').length}/${c.tasks.length}</span>
      </div>
      ${c.instructions ? `<div class="sub" style="margin-top:6px">📌 ${UI.esc(c.instructions.split('\n')[0])}</div>` : ''}
    </div></a>`;
  };

  /* --- サマリー --- */
  const weekAgo = Date.now() - 7 * 864e5;
  const inProg = all.filter(c => c.status === 'in_progress').length;
  const doneWeek = all.filter(c => c.status === 'confirmed' && c.workEndedAt &&
    new Date(c.workEndedAt).getTime() >= weekAgo).length;

  const attnCount = stalled.length + awaiting.length + overdueCases.length + escalated.length + unackedReports.length;
  let html = `<div class="section-label">要対応（${attnCount}）</div>`;
  html += attnCount
    ? stalled.map(stallRow).join('') + awaiting.map(awaitRow).join('')
      + overdueCases.map(overdueRow).join('') + escalated.map(qRow).join('')
      + unackedReports.map(siteReportRow).join('')
    : `<div class="empty">要対応はありません</div>`;

  /* --- 今日の並び替え（admin のみ） --- */
  const SORT_KEY = 'genba.todaySort';
  const SORT_OPTS = [
    ['time', '対応時刻順'],
    ['worker', '担当者別'],
    ['property', '物件別'],
    ['type', '区分別'],
  ];
  let todaySort = (s.role === 'admin' && localStorage.getItem(SORT_KEY)) || 'time';

  function groupBy(arr, keyFn) {
    const map = new Map();
    arr.forEach(c => {
      const k = keyFn(c);
      if (!map.has(k)) map.set(k, []);
      map.get(k).push(c);
    });
    return map;
  }

  function renderSortedTodays(sort) {
    if (!todays.length) return `<div class="empty">今日の現場はありません</div>`;
    const sorted = [...todays].sort((a, b) => (a.scheduledAt || '').localeCompare(b.scheduledAt || ''));
    if (sort === 'time') return sorted.map(caseCard).join('');
    let keyFn;
    if (sort === 'worker') keyFn = c => c.assignedName || '\x00未定'; // \x00 で先頭ソート
    if (sort === 'property') keyFn = c => c.propertyName || '—';
    if (sort === 'type') keyFn = c => c.workType || '—';
    const grouped = groupBy(sorted, keyFn);
    // workerモード: 未定グループを先頭に
    let keys = [...grouped.keys()];
    if (sort === 'worker') {
      keys = keys.sort((a, b) => {
        if (a === '\x00未定') return -1;
        if (b === '\x00未定') return 1;
        return a.localeCompare(b, 'ja');
      });
    } else {
      keys = keys.sort((a, b) => a.localeCompare(b, 'ja'));
    }
    return keys.map(k => {
      const label = k === '\x00未定' ? '担当者未定' : k;
      const items = grouped.get(k);
      return `<div class="section-label" style="margin-top:8px">${UI.esc(label)}（${items.length}件）</div>`
        + items.map(caseCard).join('');
    }).join('');
  }

  const sortChips = s.role === 'admin'
    ? `<div class="chiprow" id="sort-chips" style="margin:0 0 8px">` +
      SORT_OPTS.map(([k, label]) =>
        `<button class="chip ${k === todaySort ? 'active' : ''}" data-sort="${k}">${label}</button>`
      ).join('') + `</div>`
    : '';

  html += `<div class="section-label">今日の現場（${todays.length}）</div>`;
  html += sortChips;
  html += `<div id="today-list">${renderSortedTodays(todaySort)}</div>`;

  html += `<a class="cardlink" href="list.html"><div class="card tappable">
    <div class="row" style="gap:28px">
      <div><div class="statnum">${inProg}</div><div class="statlabel">進行中</div></div>
      <div><div class="statnum">${doneWeek}</div><div class="statlabel">今週完了</div></div>
      <div><div class="statnum">${all.length}</div><div class="statlabel">全案件</div></div>
    </div>
  </div></a>`;

  const main = document.getElementById('main');
  main.innerHTML = html;
  UI.tabbar('今日');
  if (s.role === 'admin')
    document.body.insertAdjacentHTML('beforeend', `<a class="fab" href="new-case.html">＋</a>`);

  /* 並び替えチップ */
  if (s.role === 'admin') {
    main.addEventListener('click', e => {
      const chip = e.target.closest('[data-sort]');
      if (!chip) return;
      todaySort = chip.dataset.sort;
      localStorage.setItem(SORT_KEY, todaySort);
      main.querySelectorAll('[data-sort]').forEach(c =>
        c.classList.toggle('active', c.dataset.sort === todaySort));
      document.getElementById('today-list').innerHTML = renderSortedTodays(todaySort);
    });
  }

  /* 要回答: タップで回答欄を開閉、送信で Store.answerQuestion */
  main.addEventListener('click', async e => {
    const send = e.target.closest('[data-send]');
    if (send) {
      const i = +send.dataset.send; const q = escalated[i];
      const text = document.getElementById(`qt-${i}`).value.trim();
      if (!text) { UI.toast('回答を入力してください'); return; }
      await Store.answerQuestion(q.caseId, q.id, text);
      UI.toast('回答を送信しました');
      send.closest('.card').remove();
      return;
    }
    const card = e.target.closest('[data-q]');
    if (card && !e.target.closest('textarea')) {
      const f = document.getElementById(`qf-${card.dataset.q}`);
      f.hidden = !f.hidden;
    }
  });
})();
</script>
<script>
if ('serviceWorker' in navigator && location.hostname.endsWith('github.io'))
  navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
