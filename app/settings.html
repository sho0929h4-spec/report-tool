<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>設定 — 現場管理</title>
<link rel="stylesheet" href="shared/style.css">
<meta name="theme-color" content="#16304d">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>
<body>
<header class="app"><h1>設定</h1></header>
<main>
  <div class="section-label">アカウント</div>
  <div class="card" id="role-card"></div>

  <div id="admin-section" hidden>
    <div class="section-label">管理者機能</div>
    <a class="card tappable cardlink" href="monthly.html" id="monthly-link"
      style="display:flex;justify-content:space-between;align-items:center;text-decoration:none">
      <div style="font-weight:700;font-size:14px">月次集計</div>
      <div style="color:var(--sub);font-size:13px">›</div>
    </a>

    <div class="section-label">単価設定</div>
    <div class="card" id="rate-card">
      <div class="empty">読み込み中…</div>
    </div>

    <div class="section-label">データ保存期間</div>
    <div class="card" id="retention-card">
      <div class="empty">読み込み中…</div>
    </div>
  </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="shared/config.js"></script>
<script src="shared/calc.js"></script>
<script src="shared/store.js"></script>
<script src="shared/ui.js"></script>
<script>
(async () => {
  if (!(await Store.init())) return;
  const s = Store.session();

  // アカウントカード
  document.getElementById('role-card').innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:center;">
      <div><div style="font-weight:800;font-size:16px;">${UI.esc(s.name)}</div>
        <div style="font-size:12px;color:#667;">${s.role === 'admin' ? '管理者' : '作業担当'}</div></div>
      <button id="btn-logout" style="padding:10px 16px;border:1.5px solid #c0392b;border-radius:10px;
        background:#fff;color:#c0392b;font-weight:700;font-family:inherit;cursor:pointer;">ログアウト</button>
    </div>`;
  document.getElementById('btn-logout').onclick = () => Store.logout();

  if (s.role !== 'admin') {
    UI.tabbar('設定');
    return;
  }

  // 管理者専用セクション
  document.getElementById('admin-section').hidden = false;

  // 単価設定を読み込み
  let tenant, rateByUser, members;
  try {
    [tenant, rateByUser, members] = await Promise.all([
      Store.getTenant(),
      Store.listRates(),
      Store.listMembers(),
    ]);
  } catch (e) {
    UI.toast('読み込みエラー: ' + e.message);
    UI.tabbar('設定');
    return;
  }

  function renderRateCard() {
    const workers = members.filter(m => m.role === 'worker');
    const workerRows = workers.map(m => {
      const hr = rateByUser[m.userId];
      const disp = hr != null ? `${Number(hr).toLocaleString('ja-JP')}円/h` : '既定を使用';
      return `<div class="kv" style="border-bottom:1px solid var(--line)">
        <dt style="color:var(--sub);font-weight:700;width:auto;flex:1">${UI.esc(m.name)}</dt>
        <dd style="margin:0;display:flex;align-items:center;gap:8px">
          <span>${UI.esc(disp)}</span>
          <button class="minibtn" data-uid="${UI.esc(m.userId)}" data-name="${UI.esc(m.name)}" data-rate="${hr != null ? hr : ''}">変更</button>
        </dd>
      </div>`;
    }).join('');

    document.getElementById('rate-card').innerHTML = `
      <div style="font-size:14px;font-weight:800;margin-bottom:4px">単価設定</div>
      <div style="font-size:12px;color:var(--sub);margin-bottom:12px">人件費の自動計算（作業時間 × 単価）に使われます。作業者からは見えません。</div>
      <div class="field">
        <label>既定単価（円/時間）</label>
        <input type="number" id="default-rate" value="${tenant.defaultHourlyRate ?? 3000}" min="0" step="100">
      </div>
      <button class="btn primary" id="save-default-rate" style="margin-bottom:14px">既定単価を保存</button>
      ${workers.length ? `<div style="font-size:12px;font-weight:700;color:var(--sub);margin-bottom:8px">職人別単価</div>${workerRows}` : ''}
    `;

    document.getElementById('save-default-rate').onclick = async () => {
      const val = parseInt(document.getElementById('default-rate').value, 10);
      if (isNaN(val) || val < 0) { UI.toast('正しい金額を入力してください'); return; }
      const btn = document.getElementById('save-default-rate');
      btn.disabled = true;
      try {
        tenant = await Store.saveTenant({ defaultHourlyRate: val });
        UI.toast('既定単価を保存しました');
        renderRateCard();
      } catch (e) {
        UI.toast('エラー: ' + e.message);
        btn.disabled = false;
      }
    };

    document.getElementById('rate-card').querySelectorAll('[data-uid]').forEach(btn => {
      btn.onclick = () => {
        const uid = btn.dataset.uid;
        const name = btn.dataset.name;
        const currentRate = btn.dataset.rate;
        const input = prompt(
          `${name} の単価（円/時間）を入力\n空欄で「既定を使用」に戻します`,
          currentRate
        );
        if (input === null) return; // キャンセル
        const trimmed = input.trim();
        const newRate = trimmed === '' ? null : parseInt(trimmed, 10);
        if (trimmed !== '' && (isNaN(newRate) || newRate < 0)) {
          UI.toast('正しい金額を入力してください');
          return;
        }
        btn.disabled = true;
        Store.saveRate(uid, newRate).then(() => {
          rateByUser[uid] = newRate;
          if (newRate == null) delete rateByUser[uid];
          renderRateCard();
          UI.toast(newRate == null ? '既定を使用に戻しました' : '単価を保存しました');
        }).catch(e => {
          UI.toast('エラー: ' + e.message);
        });
      };
    });
  }

  function renderRetentionCard() {
    const OPTIONS = [6, 12, 24, 36];
    const current = tenant.retentionMonths ?? 36;
    // 現在値が選択肢にない場合は追加
    const allOptions = OPTIONS.includes(current) ? OPTIONS : [...OPTIONS, current].sort((a, b) => a - b);
    const opts = allOptions.map(m =>
      `<option value="${m}"${m === current ? ' selected' : ''}>${m}ヶ月</option>`
    ).join('');
    document.getElementById('retention-card').innerHTML = `
      <div style="font-size:14px;font-weight:800;margin-bottom:4px">データ保存期間</div>
      <div style="font-size:12px;color:var(--sub);margin-bottom:12px">確認済みから一定期間が過ぎた案件の写真・報告を自動削除します</div>
      <div class="field">
        <select id="retention-sel" style="width:100%;border:1px solid var(--line);border-radius:10px;padding:11px 12px;font-size:14px;background:var(--surface)">
          ${opts}
        </select>
      </div>
      <div style="font-size:11.5px;color:var(--sub);background:var(--chip);border-radius:8px;padding:8px 10px;margin-bottom:12px;line-height:1.6">
        削除の対象になるのは「確認済み」の案件だけです。削除前に戻すことはできません。
      </div>
      <button class="btn primary" id="save-retention">保存</button>
    `;

    document.getElementById('save-retention').onclick = async () => {
      const val = parseInt(document.getElementById('retention-sel').value, 10);
      const btn = document.getElementById('save-retention');
      btn.disabled = true;
      try {
        tenant = await Store.saveTenant({ retentionMonths: val });
        UI.toast('保存期間を保存しました');
        renderRetentionCard();
      } catch (e) {
        UI.toast('エラー: ' + e.message);
        btn.disabled = false;
      }
    };
  }

  renderRateCard();
  renderRetentionCard();

  UI.tabbar('設定');
})();
</script>
</body>
</html>
