<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>案件 — 現場管理</title>
<link rel="stylesheet" href="shared/style.css">
<meta name="theme-color" content="#16304d">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>
<body>
<header class="app">
  <h1 id="hd" style="font-size:15px">案件</h1>
  <a href="javascript:history.back()" style="color:var(--sub);text-decoration:none;font-size:13px">← 戻る</a>
</header>
<div class="tabs" id="tabs"></div>
<main id="main"></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="shared/config.js"></script>
<script src="shared/calc.js"></script>
<script src="shared/store.js"></script>
<script src="shared/ui.js"></script>
<script>
let CASE = null;
let S = null;
let isAdmin = false;
const isNew = UI.qs('new') === '1';
let TABS = [];
let active = UI.qs('tab') || 'overview';
const WAITING = ['waiting_approval','waiting_other','waiting_schedule','on_hold'];

function renderTabs() {
  document.getElementById('tabs').innerHTML = TABS.map(([k, label]) =>
    `<button class="${k === active ? 'active' : ''}" data-k="${k}">${label}</button>`).join('');
}
document.getElementById('tabs').addEventListener('click', e => {
  if (!e.target.dataset.k) return;
  const k = e.target.dataset.k;
  const sec = document.getElementById('sec-' + k);
  if (sec) sec.scrollIntoView({ behavior: 'smooth', block: 'start' });
  active = k; renderTabs();
});
// IntersectionObserver でスクロール位置に応じてタブをハイライト
function setupScrollHighlight() {
  const obs = new IntersectionObserver(entries => {
    entries.forEach(en => {
      if (en.isIntersecting) {
        const k = en.target.id.replace('sec-', '');
        if (TABS.some(([tk]) => tk === k)) { active = k; renderTabs(); }
      }
    });
  }, { rootMargin: '-40% 0px -55% 0px' });
  TABS.forEach(([k]) => { const el = document.getElementById('sec-' + k); if (el) obs.observe(el); });
}

/* ---------- 現地報告 ---------- */
const KIND_LABEL = {
  survey: '追加調査が必要', policy: '方針変更の提案',
  arrange: '部材・業者の手配が必要', resident: '入居者対応の相談', other: 'その他',
};
const KIND_MSG = {
  survey: '追加の調査が必要と判明いたしました',
  policy: '作業方針の変更をご提案いたします',
  arrange: '部材・業者の手配が必要となりました',
  resident: '入居者様対応についてご相談がございます',
  other: '現地より報告がございます',
};
const SURVEY_ITEMS = ['開口調査','耐圧テスト','排水テスト','他室への影響確認','天井裏・床下確認','共用部（PS・外壁）確認'];

function buildSiteReportNoticeText(kind, items, note, c) {
  const itemsStr = items.length ? items.join('・') : '（なし）';
  let text = `【現地調査のご報告】${c.propertyName} ${c.roomNo}\n本日の${c.workType}にて、${KIND_MSG[kind]}。\n内容: ${itemsStr}`;
  if (note) text += `\n補足: ${note}`;
  text += `\n進め方についてご相談させてください。`;
  return text;
}

function openSiteReportSheet() {
  const c = CASE;
  let selectedKind = 'survey';
  const selectedItems = new Set();

  function kindChipsHtml(kind) {
    return Object.entries(KIND_LABEL).map(([k, label]) =>
      `<button class="minibtn" data-kind="${k}" style="${k === kind ? 'background:var(--primary);color:#fff;border-color:var(--primary)' : ''}">${UI.esc(label)}</button>`
    ).join('');
  }
  function itemChipsHtml(kind, selItems) {
    if (kind !== 'survey') return '';
    return `<div class="fld" id="itemChipsWrap"><label style="font-size:12px;font-weight:700;color:var(--sub);display:block;margin-bottom:5px">内容（複数選択可）</label>
      <div style="display:flex;flex-wrap:wrap;gap:6px">
        ${SURVEY_ITEMS.map(it => `<button class="minibtn" data-item="${UI.esc(it)}" style="${selItems.has(it) ? 'background:var(--primary);color:#fff;border-color:var(--primary)' : ''}">${UI.esc(it)}</button>`).join('')}
      </div></div>`;
  }

  const mask = document.createElement('div'); mask.className = 'sheet-mask';
  document.body.appendChild(mask);

  function render() {
    mask.innerHTML = `<div class="sheet" style="max-height:90vh;overflow-y:auto">
      <div class="title">現地報告</div>
      <div class="sub" style="margin:2px 0 12px">${UI.esc(c.propertyName)} ${UI.esc(c.roomNo)} ・ ${UI.esc(c.workType)}（作業中）</div>
      <div class="fld"><label style="font-size:12px;font-weight:700;color:var(--sub);display:block;margin-bottom:5px">種別（1つ選択）</label>
        <div style="display:flex;flex-wrap:wrap;gap:6px" id="kindChips">${kindChipsHtml(selectedKind)}</div></div>
      <div id="itemsWrap">${itemChipsHtml(selectedKind, selectedItems)}</div>
      <div class="field"><label>補足（自由記載）</label>
        <textarea id="srNote" rows="3" style="width:100%;box-sizing:border-box;border:1px solid var(--line);border-radius:10px;padding:10px;font-size:14px;font-family:inherit;background:var(--surface)" placeholder="${selectedKind !== 'survey' ? '内容を入力（必須）' : '任意'}"></textarea></div>
      <div class="field"><label>報告先</label>
        <div style="display:flex;flex-direction:column;gap:8px">
          <label id="sr-recv-internal" style="display:flex;align-items:center;gap:10px;border:1.5px solid var(--primary);background:var(--primary-weak);border-radius:10px;padding:11px 12px;font-size:14px;font-weight:700;cursor:pointer">
            <input type="checkbox" id="sr-chk-internal" checked style="width:20px;height:20px;accent-color:var(--primary)">社内（管理者）<span style="margin-left:auto;font-size:11px;font-weight:700;color:var(--sub);background:var(--chip);border-radius:999px;padding:3px 8px">アプリ内</span></label>
          <label id="sr-recv-manager" style="display:flex;align-items:center;gap:10px;border:1.5px solid var(--line);border-radius:10px;padding:11px 12px;font-size:14px;font-weight:700;cursor:pointer">
            <input type="checkbox" id="sr-chk-manager" style="width:20px;height:20px;accent-color:var(--primary)">管理会社<span style="margin-left:auto;font-size:11px;font-weight:700;color:var(--sub);background:var(--chip);border-radius:999px;padding:3px 8px">文面コピー</span></label>
          <label id="sr-recv-owner" style="display:flex;align-items:center;gap:10px;border:1.5px solid var(--line);border-radius:10px;padding:11px 12px;font-size:14px;font-weight:700;cursor:pointer">
            <input type="checkbox" id="sr-chk-owner" style="width:20px;height:20px;accent-color:var(--primary)">オーナー<span style="margin-left:auto;font-size:11px;font-weight:700;color:var(--sub);background:var(--chip);border-radius:999px;padding:3px 8px">文面コピー</span></label>
        </div></div>
      <button class="btn primary" id="srSend">報告を送信</button>
      <button class="btn ghost" id="srCancel" style="margin-top:8px">キャンセル</button>
    </div>`;

    // 種別チップクリック
    mask.querySelectorAll('[data-kind]').forEach(btn => {
      btn.onclick = () => {
        selectedKind = btn.dataset.kind;
        selectedItems.clear();
        mask.querySelector('#kindChips').innerHTML = kindChipsHtml(selectedKind);
        mask.querySelector('#itemsWrap').innerHTML = itemChipsHtml(selectedKind, selectedItems);
        mask.querySelector('#srNote').placeholder = selectedKind !== 'survey' ? '内容を入力（必須）' : '任意';
        bindItemChips();
      };
    });
    bindItemChips();

    // 報告先チェックのスタイル連動
    ['internal','manager','owner'].forEach(key => {
      const chk = mask.querySelector(`#sr-chk-${key}`);
      const lbl = mask.querySelector(`#sr-recv-${key}`);
      chk.addEventListener('change', () => {
        lbl.style.borderColor = chk.checked ? 'var(--primary)' : 'var(--line)';
        lbl.style.background = chk.checked ? 'var(--primary-weak)' : '';
      });
    });

    mask.querySelector('#srCancel').onclick = () => mask.remove();
    mask.querySelector('#srSend').onclick = async () => {
      const note = (mask.querySelector('#srNote').value || '').trim();
      const items = selectedKind === 'survey' ? [...selectedItems] : [];
      if (selectedKind !== 'survey' && !note) {
        UI.toast('補足（内容）を入力してください'); return;
      }
      const recipients = [];
      if (mask.querySelector('#sr-chk-internal').checked) recipients.push('internal');
      if (mask.querySelector('#sr-chk-manager').checked) recipients.push('manager');
      if (mask.querySelector('#sr-chk-owner').checked) recipients.push('owner');
      const sendBtn = mask.querySelector('#srSend'); sendBtn.disabled = true;
      try {
        await Store.addSiteReport(c.id, { kind: selectedKind, items, note: note || null, recipients });
        const needCopy = recipients.includes('manager') || recipients.includes('owner');
        if (needCopy) {
          const text = buildSiteReportNoticeText(selectedKind, items, note, c);
          await copyText(text);
          UI.toast('報告を記録しました。通知文をコピーしたのでLINE/SMSに貼って送信してください');
        } else {
          UI.toast('報告を記録しました');
        }
        mask.remove();
        await renderAllSections();
      } catch (e) {
        UI.toast('エラー: ' + e.message);
        sendBtn.disabled = false;
      }
    };
  }

  function bindItemChips() {
    mask.querySelectorAll('[data-item]').forEach(btn => {
      btn.onclick = () => {
        const it = btn.dataset.item;
        if (selectedItems.has(it)) selectedItems.delete(it);
        else selectedItems.add(it);
        btn.style.background = selectedItems.has(it) ? 'var(--primary)' : '';
        btn.style.color = selectedItems.has(it) ? '#fff' : '';
        btn.style.borderColor = selectedItems.has(it) ? 'var(--primary)' : '';
      };
    });
  }

  render();
  mask.addEventListener('click', e => { if (e.target === mask) mask.remove(); });
}

async function renderSiteReports(containerEl) {
  const reports = await Store.listSiteReports(CASE.id);
  if (!reports.length) {
    containerEl.innerHTML = '';
    return;
  }
  const rows = reports.map(r => {
    const d = new Date(r.createdAt);
    const timeStr = `${d.getHours()}:${String(d.getMinutes()).padStart(2,'0')}`;
    const itemsStr = r.items && r.items.length ? r.items.map(i => UI.esc(i)).join('・') : '';
    const noteStr = r.note ? `「${UI.esc(r.note)}」` : '';
    const detail = [itemsStr, noteStr].filter(Boolean).join(' ／ ');
    const ackBtn = isAdmin && !r.acked
      ? `<button class="minibtn" data-sraid="${r.id}" style="margin-left:auto;flex-shrink:0">確認</button>` : '';
    const ackedMark = r.acked ? '<span style="color:var(--ok);font-size:12px;font-weight:700;margin-left:auto">確認済</span>' : '';
    return `<div class="card" style="margin-bottom:8px">
      <div class="row between" style="align-items:flex-start">
        <span class="badge submitted" style="font-size:12px">${UI.esc(KIND_LABEL[r.kind] || r.kind)}</span>
        ${ackBtn}${ackedMark}
      </div>
      ${detail ? `<div style="font-size:13px;margin-top:6px;color:var(--ink)">${detail}</div>` : ''}
      <div class="sub" style="margin-top:4px">${UI.esc(r.byName)} ・ ${UI.esc(timeStr)}</div>
    </div>`;
  }).join('');
  containerEl.innerHTML = `<div class="section-label" style="margin-top:10px">現地報告（${reports.length}件）</div>${rows}`;
  containerEl.querySelectorAll('[data-sraid]').forEach(btn => {
    btn.onclick = async () => {
      btn.disabled = true;
      try {
        await Store.ackSiteReport(btn.dataset.sraid);
        await renderAllSections();
      } catch (e) {
        UI.toast('エラー: ' + e.message);
        btn.disabled = false;
      }
    };
  });
}

/* ---------- 概要タブ ---------- */
const STATUS_NEXT = { scheduled: ['in_progress', '▶ 作業開始（打刻）', 'start'],
                      in_progress: ['submitted', '✅ 作業終了・送信（打刻）', 'finish'] };
function mapsLink(addr) {
  const enc = encodeURIComponent(addr);
  return `<a href="javascript:void(0)" onclick="openMapSheet(${JSON.stringify(addr)})" style="color:var(--primary)">${UI.esc(addr)} 🗺</a>`;
}
function openMapSheet(addr) {
  const enc = encodeURIComponent(addr);
  const mask = document.createElement('div'); mask.className = 'sheet-mask';
  mask.innerHTML = `<div class="sheet">
    <div class="title" style="margin-bottom:12px;font-size:14px">地図アプリを選択</div>
    <a class="opt" href="https://maps.apple.com/?q=${enc}" target="_blank" rel="noopener">🗺 Appleマップで開く</a>
    <a class="opt" href="https://www.google.com/maps/search/?api=1&query=${enc}" target="_blank" rel="noopener">🌍 Googleマップで開く</a>
    <button class="opt" id="mapDepart">出発する（到着予定を通知）</button>
    <button class="opt" id="mapCancel" style="color:var(--sub);border-bottom:none">キャンセル</button>
  </div>`;
  document.body.appendChild(mask);
  mask.querySelector('#mapCancel').onclick = () => mask.remove();
  mask.querySelector('#mapDepart').onclick = () => { mask.remove(); openDepartSheet(); };
  mask.addEventListener('click', e => { if (e.target === mask) mask.remove(); });
}
/* ---- 出発シート ---- */
function fmtHHMM(date) {
  return `${date.getHours()}:${String(date.getMinutes()).padStart(2, '0')}`;
}
function roundUp5(date) {
  const m = date.getMinutes();
  const r = Math.ceil(m / 5) * 5;
  const d = new Date(date);
  d.setMinutes(r); d.setSeconds(0); d.setMilliseconds(0);
  return d;
}
// mode: 'depart'（初回出発）| 'update'（到着予定変更）
function openDepartSheet(mode) {
  mode = mode || 'depart';
  const c = CASE;
  const mv = c.movement;
  // 初期ETA: updateモードなら既存etaAt、departなら30分後
  const initEta = (mode === 'update' && mv && mv.etaAt)
    ? new Date(mv.etaAt)
    : roundUp5(new Date(Date.now() + 30 * 60000));
  let etaDate = new Date(initEta);

  function calcDiffMin(eta) {
    if (!c.scheduledAt) return 0;
    return Math.round((eta - new Date(c.scheduledAt)) / 60000);
  }
  function delayText(eta) {
    if (!c.scheduledAt) return '';
    const sched = new Date(c.scheduledAt);
    const diffMin = calcDiffMin(eta);
    if (diffMin <= 0) return '<span style="color:var(--ok);font-weight:700">予定どおりの見込み</span>';
    return `<span style="color:var(--danger);font-weight:700">予定 ${fmtHHMM(sched)} より <b>${diffMin}分遅れ</b> の見込み</span>`;
  }
  function getDelayReason(mask) {
    const diffMin = calcDiffMin(etaDate);
    if (diffMin <= 0) return null;
    const sel = mask.querySelector('#delayReasonSel');
    if (!sel) return null;
    if (sel.value === 'その他') {
      const txt = (mask.querySelector('#delayReasonText').value || '').trim();
      return txt || 'その他';
    }
    return sel.value;
  }
  function buildNoticeText(eta, delayReason) {
    const etaStr = fmtHHMM(eta);
    const schedStr = c.scheduledAt ? fmtHHMM(new Date(c.scheduledAt)) : '--:--';
    const diffMin = calcDiffMin(eta);
    let delayNote = '予定どおりの見込みです';
    if (diffMin > 0) {
      const reasonPart = delayReason ? `。理由: ${delayReason}` : '';
      delayNote = `当初予定 ${schedStr} から約${diffMin}分遅れの見込みです${reasonPart}`;
    }
    if (mode === 'update') {
      const reasonPart = delayReason ? `（約${diffMin}分遅れ。理由: ${delayReason}）` : `（約${diffMin}分遅れ）`;
      return `【到着予定変更のお知らせ】${c.propertyName} ${c.roomNo}\n到着予定を ${etaStr}頃 に変更いたします${diffMin > 0 ? reasonPart : ''}。\n到着しましたら改めてご連絡いたします。`;
    }
    return `【到着予定のお知らせ】${c.propertyName} ${c.roomNo}\n本日の${c.workType}につきまして、作業員が現地へ向かっております。\n到着予定: ${etaStr}頃（${delayNote}）\n到着しましたら改めてご連絡いたします。`;
  }
  function delayReasonHtml(diffMin, currentReason) {
    if (diffMin <= 0) return '';
    const isOther = currentReason && currentReason !== '渋滞';
    const otherVal = isOther ? currentReason : '';
    return `<div id="delayReasonBlock" style="background:var(--chip);border-radius:10px;padding:10px 12px;margin-bottom:12px">
      <div style="font-size:13px;font-weight:700;margin-bottom:8px;color:var(--ink)">遅れの理由</div>
      <select id="delayReasonSel" style="width:100%;border:1px solid var(--line);border-radius:8px;padding:9px 10px;font-size:14px;background:var(--surface)">
        <option value="渋滞"${!isOther ? ' selected' : ''}>渋滞</option>
        <option value="その他"${isOther ? ' selected' : ''}>その他</option>
      </select>
      <input id="delayReasonText" type="text" placeholder="理由を入力"
        value="${UI.esc(otherVal)}"
        style="width:100%;box-sizing:border-box;border:1px solid var(--line);border-radius:8px;padding:9px 10px;font-size:14px;margin-top:8px;display:${isOther ? 'block' : 'none'}">
    </div>`;
  }

  function render(mask) {
    const etaStr = fmtHHMM(etaDate);
    const schedStr = c.scheduledAt ? fmtHHMM(new Date(c.scheduledAt)) : '--:--';
    const diffMin = calcDiffMin(etaDate);
    const initReason = (mode === 'update' && mv && mv.delayReason) ? mv.delayReason : null;
    const initRecipients = (mode === 'update' && mv && mv.recipients) ? mv.recipients : ['internal', 'resident'];
    const titleText = mode === 'update' ? '到着予定を変更' : '出発を通知';
    const btnText = mode === 'update' ? '変更を通知する' : '出発を通知する';
    mask.innerHTML = `<div class="sheet">
      <div class="title">${titleText}</div>
      <div class="sub" style="margin:2px 0 12px">${UI.esc(c.propertyName)} ${UI.esc(c.roomNo)}（予定 ${schedStr}）へ向かいます</div>
      <div style="display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;padding:10px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-bottom:12px">
        📍 ${UI.esc(c.address)} <span style="font-weight:400;color:var(--sub)">／ 地図アプリの所要時間を見て調整してください</span>
      </div>
      <div style="font-size:11.5px;color:var(--sub);background:var(--chip);border-radius:8px;padding:8px 10px;margin-bottom:12px;line-height:1.6">
        ※ 公式LINE連携後は到着予定を自動計算して自動送信します。
      </div>
      <div style="display:flex;align-items:center;justify-content:center;gap:10px;margin:10px 0 4px">
        <button id="etaMinus" style="width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:16px;font-weight:700;color:var(--primary)">−15</button>
        <div id="etaDisplay" style="font-size:34px;font-weight:800;letter-spacing:1px">${etaStr}</div>
        <button id="etaPlus" style="width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-size:16px;font-weight:700;color:var(--primary)">＋15</button>
      </div>
      <div id="delayLine" style="text-align:center;font-size:13px;margin-bottom:10px">${delayText(etaDate)}</div>
      <div id="delayReasonWrap">${delayReasonHtml(diffMin, initReason)}</div>
      <div style="display:flex;flex-direction:column;gap:8px;margin-bottom:14px">
        <label id="recv-internal" style="display:flex;align-items:center;gap:10px;border:1.5px solid ${initRecipients.includes('internal') ? 'var(--primary)' : 'var(--line)'};background:${initRecipients.includes('internal') ? 'var(--primary-weak)' : ''};border-radius:10px;padding:11px 12px;font-size:14px;font-weight:700;cursor:pointer">
          <input type="checkbox" id="chk-internal" ${initRecipients.includes('internal') ? 'checked' : ''} style="width:20px;height:20px;accent-color:var(--primary)">社内（管理者）<span style="margin-left:auto;font-size:11px;font-weight:700;color:var(--sub);background:var(--chip);border-radius:999px;padding:3px 8px">アプリ内</span>
        </label>
        <label id="recv-resident" style="display:flex;align-items:center;gap:10px;border:1.5px solid ${initRecipients.includes('resident') ? 'var(--primary)' : 'var(--line)'};background:${initRecipients.includes('resident') ? 'var(--primary-weak)' : ''};border-radius:10px;padding:11px 12px;font-size:14px;font-weight:700;cursor:pointer">
          <input type="checkbox" id="chk-resident" ${initRecipients.includes('resident') ? 'checked' : ''} style="width:20px;height:20px;accent-color:var(--primary)">入居者<span style="margin-left:auto;font-size:11px;font-weight:700;color:#06c755;background:#e7f8ee;border-radius:999px;padding:3px 8px">LINE（将来）/ 文面コピー</span>
        </label>
        <label id="recv-manager" style="display:flex;align-items:center;gap:10px;border:1.5px solid ${initRecipients.includes('manager') ? 'var(--primary)' : 'var(--line)'};background:${initRecipients.includes('manager') ? 'var(--primary-weak)' : ''};border-radius:10px;padding:11px 12px;font-size:14px;font-weight:700;cursor:pointer">
          <input type="checkbox" id="chk-manager" ${initRecipients.includes('manager') ? 'checked' : ''} style="width:20px;height:20px;accent-color:var(--primary)">管理会社<span style="margin-left:auto;font-size:11px;font-weight:700;color:#06c755;background:#e7f8ee;border-radius:999px;padding:3px 8px">LINE（将来）/ 文面コピー</span>
        </label>
      </div>
      <button class="btn primary" id="departBtn">${btnText}</button>
      <button class="btn ghost" id="departCancel" style="margin-top:8px">キャンセル</button>
    </div>`;

    // チェックラベルのスタイル連動
    ['internal', 'resident', 'manager'].forEach(key => {
      const chk = mask.querySelector(`#chk-${key}`);
      const lbl = mask.querySelector(`#recv-${key}`);
      chk.addEventListener('change', () => {
        lbl.style.borderColor = chk.checked ? 'var(--primary)' : 'var(--line)';
        lbl.style.background = chk.checked ? 'var(--primary-weak)' : '';
      });
    });

    // 遅れ理由: セレクト変更でテキスト欄表示切替
    mask.querySelector('#delayReasonSel') && mask.querySelector('#delayReasonSel').addEventListener('change', e => {
      const txt = mask.querySelector('#delayReasonText');
      txt.style.display = e.target.value === 'その他' ? 'block' : 'none';
    });

    function updateDelayBlock() {
      const dm = calcDiffMin(etaDate);
      mask.querySelector('#delayLine').innerHTML = delayText(etaDate);
      const wrap = mask.querySelector('#delayReasonWrap');
      const currentReason = getDelayReason(mask);
      wrap.innerHTML = delayReasonHtml(dm, currentReason);
      // 再バインド
      const sel = mask.querySelector('#delayReasonSel');
      if (sel) sel.addEventListener('change', e => {
        const txt = mask.querySelector('#delayReasonText');
        txt.style.display = e.target.value === 'その他' ? 'block' : 'none';
      });
    }

    mask.querySelector('#etaMinus').onclick = () => {
      etaDate = new Date(etaDate.getTime() - 15 * 60000);
      mask.querySelector('#etaDisplay').textContent = fmtHHMM(etaDate);
      updateDelayBlock();
    };
    mask.querySelector('#etaPlus').onclick = () => {
      etaDate = new Date(etaDate.getTime() + 15 * 60000);
      mask.querySelector('#etaDisplay').textContent = fmtHHMM(etaDate);
      updateDelayBlock();
    };
    mask.querySelector('#departCancel').onclick = () => mask.remove();
    mask.querySelector('#departBtn').onclick = async () => {
      const recipients = [];
      if (mask.querySelector('#chk-internal').checked) recipients.push('internal');
      if (mask.querySelector('#chk-resident').checked) recipients.push('resident');
      if (mask.querySelector('#chk-manager').checked) recipients.push('manager');
      const delayReason = getDelayReason(mask);
      mask.querySelector('#departBtn').disabled = true;
      try {
        CASE = await Store.setDeparture(c.id, {
          etaAt: etaDate.toISOString(), recipients, delayReason,
          keepDepartedAt: mode === 'update',
        });
        const needCopy = recipients.includes('resident') || recipients.includes('manager');
        if (needCopy) {
          const text = buildNoticeText(etaDate, delayReason);
          await copyText(text);
          const toastMsg = mode === 'update'
            ? '到着予定を変更しました。通知文をコピーしたのでLINE/SMSに貼って送信してください'
            : '出発を記録しました。通知文をコピーしたのでLINE/SMSに貼って送信してください';
          UI.toast(toastMsg);
        } else {
          UI.toast(mode === 'update' ? '到着予定を変更しました' : '出発を記録しました');
        }
        mask.remove();
        await renderAllSections();
      } catch (e) {
        UI.toast('エラー: ' + e.message);
        mask.querySelector('#departBtn').disabled = false;
      }
    };
  }

  const mask = document.createElement('div'); mask.className = 'sheet-mask';
  document.body.appendChild(mask);
  render(mask);
  mask.addEventListener('click', e => { if (e.target === mask) mask.remove(); });
}
function workDuration() {
  if (!CASE.workStartedAt) return '—';
  const end = CASE.workEndedAt ? UI.fmtTime(CASE.workEndedAt) : '…';
  let dur = '';
  if (CASE.workEndedAt) {
    const m = Math.round((new Date(CASE.workEndedAt) - new Date(CASE.workStartedAt)) / 60000);
    dur = `（${Math.floor(m / 60)}時間${m % 60}分）`;
  }
  return `${UI.fmtTime(CASE.workStartedAt)} 〜 ${end} ${dur}`;
}

/* ---------- タスクタブ（差分J: チェックダウン方式） ---------- */
function renderTasks() {
  const now = new Date().toISOString();
  const rows = CASE.tasks.map((t, i) => {
    const waiting = WAITING.includes(t.status);
    const isChip = waiting || t.status === 'doing'; // doing もチップ表示（消滅防止）
    const stall = isChip ? Calc.stallHours(t.updatedAt, now) : null;
    const over = Calc.isOverdue(t.dueAt, now, t.status);
    const doneInfo = t.status === 'done' && t.doneByName
      ? `<div class="sub" style="margin-top:2px;color:var(--ok)">✓ ${UI.esc(t.doneByName)}${t.doneAt ? ' ' + UI.fmtDate(t.doneAt) + ' ' + UI.fmtTime(t.doneAt) : ''}</div>`
      : '';
    // waiting系・doing: チップ表示。todo/done: チェックボックスボタン
    const leftCtrl = isChip
      ? `<button class="chip tchip ${UI.esc(t.status)}" data-ti="${i}">${UI.TASK_STATUS[t.status] || UI.esc(t.status)}</button>`
      : `<button class="task-chk ${t.status === 'done' ? 'task-chk-done' : ''}" data-ci="${i}" aria-label="${t.status === 'done' ? '未完了に戻す' : '完了にする'}">${t.status === 'done' ? '✓' : ''}</button>`;
    // admin はタイトル部タップで従来シートを開ける
    const titleEl = isAdmin && !isChip
      ? `<div class="ttitle ${t.status === 'done' ? 'tdone' : ''} task-title-tap" data-si="${i}" style="cursor:pointer">${UI.esc(t.title)}</div>`
      : `<div class="ttitle ${t.status === 'done' ? 'tdone' : ''}">${UI.esc(t.title)}</div>`;
    return `<div class="trow">
      ${leftCtrl}
      <div style="flex:1;min-width:0">
        ${titleEl}
        <div class="sub" style="margin-top:2px">👤 ${UI.esc(t.assigneeName || '—')}
          ${t.dueAt ? `・期限 ${UI.fmtDate(t.dueAt)} ${UI.fmtTime(t.dueAt)}` : ''}
          ${over ? ' <span class="due-danger">超過</span>' : ''}
          ${stall != null ? `・<b>${stall}時間経過</b>` : ''}
          ${waiting && t.stallReason ? `（${UI.esc(t.stallReason)}）` : ''}</div>
        ${doneInfo}
      </div>
    </div>`;
  }).join('');
  document.getElementById('main').innerHTML = `<div class="card">
    ${CASE.tasks.length ? rows : '<div class="empty">タスクはありません</div>'}
    ${isAdmin ? `<div class="row" style="margin-top:10px">
      <input id="newTask" class="search" style="margin:0" placeholder="タスクを追加">
      <button class="btn primary" id="addTask" style="width:72px;padding:10px">追加</button></div>` : ''}
  </div>`;
  // チップ（waiting系・doing）のタップ処理
  document.getElementById('main').querySelectorAll('[data-ti]').forEach(ch => {
    ch.onclick = async () => {
      if (isAdmin) {
        // admin は従来シートを開く
        openSheet(+ch.dataset.ti);
      } else {
        // worker: チップをタップ → done に更新（連打ガード）
        ch.disabled = true;
        try {
          const idx = +ch.dataset.ti;
          const t = CASE.tasks[idx];
          await Store.saveTask(CASE.id, {
            id: t.id,
            status: 'done',
            doneByName: S.name,
            doneAt: new Date().toISOString(),
            doneBy: S.userId,
          });
          CASE = await Store.getCase(CASE.id); await renderAllSections();
        } finally {
          ch.disabled = false;
        }
      }
    };
  });
  // チェックボックスボタン → todo/done トグル（連打ガード付き）
  document.getElementById('main').querySelectorAll('[data-ci]').forEach(btn =>
    btn.onclick = async () => {
      btn.disabled = true;
      try {
        const idx = +btn.dataset.ci;
        const t = CASE.tasks[idx];
        const isDone = t.status === 'done';
        await Store.saveTask(CASE.id, {
          id: t.id,
          status: isDone ? 'todo' : 'done',
          doneByName: isDone ? null : S.name,
          doneAt: isDone ? null : new Date().toISOString(),
          doneBy: isDone ? null : S.userId,
        });
        CASE = await Store.getCase(CASE.id); await renderAllSections();
      } finally {
        btn.disabled = false;
      }
    });
  // admin: タイトルタップで従来シート（チップ以外）
  if (isAdmin) {
    document.getElementById('main').querySelectorAll('.task-title-tap').forEach(el =>
      el.onclick = () => openSheet(+el.dataset.si));
  }
  const ab = document.getElementById('addTask');
  if (ab) ab.onclick = async () => {
    const v = document.getElementById('newTask').value.trim(); if (!v) return;
    await Store.saveTask(CASE.id, { title: v, assignee: CASE.assignedTo,
      assigneeName: CASE.assignedName, status: 'todo', dueAt: null, stallReason: null });
    CASE = await Store.getCase(CASE.id); await renderAllSections();
  };
}

function openSheet(i) {

  const ORDER = ['todo','doing','done','waiting_approval','waiting_other','waiting_schedule','on_hold'];
  let pending = null;
  const mask = document.createElement('div'); mask.className = 'sheet-mask';
  mask.innerHTML = `<div class="sheet">
    <div class="title" style="margin-bottom:6px">${UI.esc(t.title)}</div>
    ${ORDER.map(s => `<button class="opt ${s === t.status ? 'sel' : ''}" data-s="${s}">${UI.TASK_STATUS[s]}${s === t.status ? ' ✓' : ''}</button>`).join('')}
    <div class="field" id="reasonWrap" hidden style="margin-top:10px"><label>停滞理由</label>
      <input id="reasonInput" placeholder="例: 管理会社の承認待ち" value="${UI.esc(t.stallReason || '')}"></div>
    <button class="btn primary" id="sheetSave" hidden style="margin-top:10px">保存</button>
  </div>`;
  document.body.appendChild(mask);
  mask.querySelector('#sheetSave').onclick = async () => {
    await Store.saveTask(CASE.id, { id: t.id, status: pending,
      stallReason: mask.querySelector('#reasonInput').value.trim() || null });
    CASE = await Store.getCase(CASE.id); mask.remove(); await renderAllSections();
  };
  mask.addEventListener('click', async e => {
    if (e.target === mask) { mask.remove(); return; }
    const s = e.target.dataset && e.target.dataset.s;
    if (!s) return;
    if (WAITING.includes(s)) {
      pending = s;
      mask.querySelectorAll('.opt').forEach(o => o.classList.toggle('sel', o.dataset.s === s));
      mask.querySelector('#reasonWrap').hidden = false;
      mask.querySelector('#sheetSave').hidden = false;
    } else {
      await Store.saveTask(CASE.id, { id: t.id, status: s, stallReason: null });
      CASE = await Store.getCase(CASE.id); mask.remove(); await renderAllSections();
    }
  });
}

/* ---------- 連絡タブ（関係者台帳・通知プレビュー・質問対応・共有URL） ---------- */
const ROLES = [['motouke', '元請'], ['kanri', '管理会社'], ['owner', 'オーナー'], ['resident', '入居者']];
const NOTIFY_DEFS = [['workStarted', '入場通知'], ['preVisit', '前日案内'], ['reportReady', '報告書完成']];
const SH_ROLE_LABEL = { resident: '入居者', manager: '管理会社', owner: 'オーナー', contractor: '元請' };
let NOTIFY_LOG = [];   // モック送信ログ（ページ内のみ）
function progressUrl(token) {
  return location.origin + location.pathname.replace(/case\.html.*$/, 'progress.html') + '?t=' + token;
}
function buildNotice(kind) {
  const url = CASE.shareToken ? progressUrl(CASE.shareToken) : '（進捗URLを発行してください）';
  if (kind === 'workStarted') {
    const t = CASE.workStartedAt ? UI.fmtTime(CASE.workStartedAt) : '--:--';
    return `【入場通知】${CASE.propertyName} ${CASE.roomNo}\n本日 ${t} に作業員が入場し、${CASE.workType}を開始しました。\n進捗は共有ページでご確認いただけます：\n${url}`;
  }
  if (kind === 'reportReady') {
    return `【報告書完成のお知らせ】${CASE.propertyName} ${CASE.roomNo}\n${CASE.workType}の報告書が完成しました。\n内容は共有ページよりご確認いただけます：\n${url}`;
  }
  return `【作業前日のご案内】${CASE.propertyName} ${CASE.roomNo}\n明日 ${UI.fmtDate(CASE.scheduledAt)} ${UI.fmtTime(CASE.scheduledAt)} より「${CASE.workType}」を実施いたします。\n・所要時間の目安：2〜3時間\n・ご不在でも作業可能な場合は事前にご連絡ください\nご質問は共有ページから承ります：\n${url}`;
}
async function copyText(text) {
  try { await navigator.clipboard.writeText(text); return true; }
  catch (e) {
    const ta = document.createElement('textarea'); ta.value = text;
    document.body.appendChild(ta); ta.select();
    const ok = document.execCommand('copy'); ta.remove(); return ok;
  }
}

  // 進捗URL: 発行

    issueBtn.disabled = true;

  if (copyBtn) copyBtn.onclick = async () => {
    const ok = await copyText(progressUrl(CASE.shareToken));
    UI.toast(ok ? '共有URLをコピーしました' : 'コピーに失敗しました');

    <div class="section-label">明細を追加</div>
    <div class="card">
      <div class="field"><label>区分</label><select id="k-cat">
        ${Object.entries(CAT).map(([k, v]) => `<option value="${k}">${v}</option>`).join('')}</select></div>
      <div class="field"><label>内容</label><input id="k-label" placeholder="例: 止水プラグ"></div>
      <div class="row">
        <div class="field" style="flex:1"><label>数量</label><input id="k-qty" type="number" value="1"></div>
        <div class="field" style="flex:1"><label>単価（円）</label><input id="k-price" type="number"></div>
      </div>
      <button class="btn primary" id="k-add">追加</button>
    </div>
    <div class="section-label">請求額</div>
    <div class="card"><div class="field"><label>請求額（税抜・円）</label>
      <input id="k-invoice" type="number" value="${CASE.invoiceAmount ?? ''}"></div>
      <button class="btn ghost" id="k-saveinv">請求額を保存</button></div>
    ${estimateCardHtml(est)}`;
  document.getElementById('k-add').onclick = async () => {
    const qty = +document.getElementById('k-qty').value || 1;
    const price = +document.getElementById('k-price').value || 0;
    await Store.saveCost(CASE.id, { category: document.getElementById('k-cat').value,
      label: document.getElementById('k-label').value.trim() || '明細',
      qty, unitPrice: price, amount: Math.round(qty * price), isAuto: false });
    await rerenderSection('costs');
  };
  document.getElementById('k-saveinv').onclick = async () => {
    const v = document.getElementById('k-invoice').value;
    CASE = await Store.saveCase({ id: CASE.id, invoiceAmount: v === '' ? null : +v });
    UI.toast('請求額を保存しました'); await rerenderSection('costs');
  };
  document.getElementById('main').querySelectorAll('[data-delc]').forEach(b =>
    b.onclick = async () => { await Store.deleteCost(CASE.id, b.dataset.delc); await rerenderSection('costs'); });
  bindEstimateCard(est, costs);
}

/* ---------- 見積セクション（差分E: 原価タブ内） ---------- */
function estimateCardHtml(est) {
  const chipCls = { draft: '', sent: 'doing', approved: 'done', rejected: '' }[est.status] || '';
  const chipStyle = est.status === 'rejected'
    ? 'style="background:#ffe9e9;border-color:#ffc9c9;color:var(--danger)"' : '';
  const items = est.items || [];
  const itemRows = items.map((it, i) => `
    <div style="border-bottom:1px solid var(--line);padding:10px 0">
      <div class="row">
        <input data-ei="${i}" data-f="label" value="${UI.esc(it.label)}" placeholder="内容"
          style="flex:1;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:13.5px">
        <button data-edel="${i}" style="border:none;background:none;color:var(--danger);font-size:15px">✕</button>
      </div>
      <div class="row" style="margin-top:6px">
        <input data-ei="${i}" data-f="qty" type="number" value="${it.qty}"
          style="width:72px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:13.5px">
        <span class="sub">${UI.esc(it.unit || '式')} ×</span>
        <input data-ei="${i}" data-f="unitPrice" type="number" value="${it.unitPrice}"
          style="flex:1;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:13.5px">
        <span class="money" style="font-size:13.5px">= ${UI.fmtYen(Math.round((+it.qty || 0) * (+it.unitPrice || 0)))}</span>
      </div>
    </div>`).join('');
  return `
    <div class="section-label">見積</div>
    <div class="card" id="est-card">
      <div class="row between" style="margin-bottom:10px">
        <span class="chip tchip ${chipCls}" ${chipStyle}>${EST_STATUS[est.status] || est.status}</span>
        <span class="row" style="gap:6px">
          ${est.status === 'draft' ? '<button class="btn ghost" data-est="sent" style="width:auto;padding:8px 12px;font-size:12.5px">送付済にする</button>' : ''}
          ${est.status === 'sent' ? `<button class="btn ghost" data-est="approved" style="width:auto;padding:8px 12px;font-size:12.5px;color:var(--ok)">承認</button>
            <button class="btn ghost" data-est="rejected" style="width:auto;padding:8px 12px;font-size:12.5px;color:var(--danger)">否認</button>` : ''}
          ${est.status === 'approved' || est.status === 'rejected' ? '<button class="btn ghost" data-est="draft" style="width:auto;padding:8px 12px;font-size:12.5px">下書きに戻す</button>' : ''}
        </span>
      </div>
      <div class="row" style="margin-bottom:10px">
        <span class="sub" style="flex:none">掛け率</span>
        <input id="est-markup" type="number" step="0.05" value="${est.markup ?? 1.3}"
          style="width:80px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:13.5px">
        <button class="btn ghost" id="est-build" style="width:auto;flex:1;padding:8px 12px;font-size:12.5px">原価から見積を作成</button>
      </div>
      ${itemRows || '<div class="empty" style="padding:8px 0">見積明細はまだありません</div>'}
      <div class="row between" style="padding:12px 0 4px;font-weight:700">
        <span>見積合計（税抜）</span><span class="money">${UI.fmtYen(Calc.estimateTotal(items))}</span>
      </div>
      <div class="row" style="gap:8px;margin-top:8px">
        <button class="btn ghost" id="est-addrow" style="font-size:13px">＋ 行を追加</button>
        <button class="btn ghost" id="est-pdf" style="font-size:13px">📄 見積PDF</button>
      </div>
    </div>`;
}
function bindEstimateCard(est, costs) {
  const save = async () => { await Store.saveEstimate(CASE.id, est); await rerenderSection('costs'); };
  document.querySelectorAll('[data-est]').forEach(b =>
    b.onclick = async () => { est.status = b.dataset.est; await save(); UI.toast(`見積を「${EST_STATUS[est.status]}」にしました`); });
  document.getElementById('est-build').onclick = async () => {
    if ((est.items || []).length && !confirm('現在の見積明細を置き換えます。よろしいですか？')) return;
    const markup = +document.getElementById('est-markup').value || 1.3;
    est.markup = markup;
    est.items = Calc.buildEstimateFromCosts(costs.filter(k => k.amount != null), markup);
    est.status = 'draft';
    await save(); UI.toast('原価から見積を作成しました');
  };
  document.getElementById('est-addrow').onclick = async () => {
    est.items = est.items || [];
    est.items.push({ label: '', qty: 1, unit: '式', unitPrice: 0, amount: 0 });
    await save();
  };
  document.querySelectorAll('#est-card [data-ei]').forEach(inp =>
    inp.onchange = async () => {
      const it = est.items[+inp.dataset.ei];
      it[inp.dataset.f] = inp.dataset.f === 'label' ? inp.value : +inp.value || 0;
      it.amount = Math.round((+it.qty || 0) * (+it.unitPrice || 0));
      await save();
    });
  document.querySelectorAll('#est-card [data-edel]').forEach(b =>
    b.onclick = async () => { est.items.splice(+b.dataset.edel, 1); await save(); });
  document.getElementById('est-pdf').onclick = () => showEstimatePdf(est);
}
function showEstimatePdf(est) {
  const items = est.items || [];
  const total = Calc.estimateTotal(items);
  const v = document.createElement('div');
  v.style.cssText = 'position:fixed;inset:0;background:rgba(10,37,64,.55);z-index:60;display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:16px';
  v.innerHTML = `
  <div style="background:#fff;width:100%;max-width:440px;min-height:600px;border-radius:4px;padding:28px 22px;box-shadow:0 8px 30px rgba(0,0,0,.35);font-size:12.5px;color:#111">
    <div style="text-align:center;font-size:18px;font-weight:700;letter-spacing:.3em;margin-bottom:20px">御 見 積 書</div>
    <div style="display:flex;justify-content:space-between;gap:8px;margin-bottom:16px">
      <div style="min-width:0">
        <div style="font-size:14px;font-weight:700;border-bottom:1px solid #333;padding-bottom:4px">
          ${UI.esc(CASE.propertyName)} ${UI.esc(CASE.roomNo)} 御中</div>
        <div style="margin-top:6px;color:#555">${UI.esc(CASE.address || '')}</div>
      </div>
      <div style="text-align:right;color:#555;flex:none">発行日 ${new Date().toLocaleDateString('ja-JP')}<br>現場管理システム</div>
    </div>
    <div style="background:#f3f6f9;padding:10px 12px;font-weight:700;display:flex;justify-content:space-between;margin-bottom:14px">
      <span>御見積金額（税抜）</span><span class="money">${UI.fmtYen(total)}</span></div>
    <table style="width:100%;border-collapse:collapse;font-size:12px">
      <thead><tr style="background:#0a2540;color:#fff">
        <th style="padding:7px 8px;text-align:left">内容</th><th style="padding:7px 4px;text-align:right">数量</th>
        <th style="padding:7px 4px;text-align:right">単価</th><th style="padding:7px 8px;text-align:right">金額</th></tr></thead>
      <tbody>
        ${items.map(it => `<tr style="border-bottom:1px solid #e3e8ee">
          <td style="padding:7px 8px">${UI.esc(it.label || '—')}</td>
          <td style="padding:7px 4px;text-align:right">${it.qty} ${UI.esc(it.unit || '式')}</td>
          <td style="padding:7px 4px;text-align:right" class="money">${UI.fmtYen(it.unitPrice)}</td>
          <td style="padding:7px 8px;text-align:right" class="money">${UI.fmtYen(Math.round((+it.qty || 0) * (+it.unitPrice || 0)))}</td></tr>`).join('')
          || '<tr><td colspan="4" style="padding:14px;text-align:center;color:#8792a2">明細なし</td></tr>'}
        <tr><td colspan="3" style="padding:9px 8px;text-align:right;font-weight:700">合計（税抜）</td>
          <td style="padding:9px 8px;text-align:right;font-weight:700" class="money">${UI.fmtYen(total)}</td></tr>
      </tbody>
    </table>
    <div style="margin-top:14px;color:#8792a2;font-size:11px">※ モック画面です。PDF生成は計画3で実装します。</div>
    <div style="margin-top:16px"><button class="btn ghost" id="est-pdf-close">閉じる</button></div>
  </div>`;
  v.addEventListener('click', e => { if (e.target === v || e.target.id === 'est-pdf-close') v.remove(); });
  document.body.appendChild(v);
}

function setHeader() {
  document.getElementById('hd').textContent =
    CASE ? `${CASE.propertyName} ${CASE.roomNo}` : '新規案件';
}

/* ---------- 全セクション縦並びレンダリング（修正1） ---------- */
// 各 render* 関数は getElementById('main') に書き込む設計のため、
// ID を一時的にセクション要素へ付け替えてから呼び出す方式を採用する。
function withTarget(el, fn) {
  const real = document.getElementById('main');
  real.id = '__main_bak';
  el.id = 'main';
  try { return fn(); }
  finally { el.id = el.dataset.secId; real.id = 'main'; }
}
async function withTargetAsync(el, fn) {
  const real = document.getElementById('main');
  real.id = '__main_bak';
  el.id = 'main';
  try { return await fn(); }
  finally { el.id = el.dataset.secId; real.id = 'main'; }
}

// セクション単体の再描画（写真・原価など内部更新用）
async function rerenderSection(k) {
  const inner = document.getElementById('sec-inner-' + k);
  if (!inner) { await renderAllSections(); return; }
  const fns = { photos: renderPhotos, costs: renderCosts };
  const syncFns = { tasks: renderTasks, report: renderReport, contact: renderContact };
  if (k === 'overview') {
    withTarget(inner, renderOverview);
    const hist = document.getElementById('siteReportsHistory');
    if (hist) await renderSiteReports(hist);
  } else if (fns[k]) await withTargetAsync(inner, fns[k]);
  else if (syncFns[k]) withTarget(inner, syncFns[k]);
}

async function renderAllSections() {
  const mainEl = document.getElementById('main');
  mainEl.innerHTML = TABS.map(([k, label]) =>
    `<div id="sec-${k}" data-sec-id="sec-${k}" style="scroll-margin-top:90px">
       <div class="section-label" style="margin-top:8px">${label}</div>
       <div id="sec-inner-${k}" data-sec-id="sec-inner-${k}"></div>
     </div>`).join('');

  // 概要
  withTarget(document.getElementById('sec-inner-overview'), renderOverview);
  const srHistEl = document.getElementById('siteReportsHistory');
  if (srHistEl) await renderSiteReports(srHistEl);

  // タスク
  withTarget(document.getElementById('sec-inner-tasks'), renderTasks);

  // 写真（async）
  await withTargetAsync(document.getElementById('sec-inner-photos'), renderPhotos);

  // 報告
  withTarget(document.getElementById('sec-inner-report'), renderReport);

  // 連絡（async）
  await withTargetAsync(document.getElementById('sec-inner-contact'), renderContact);

  // 原価（admin のみ、async）
  if (isAdmin) await withTargetAsync(document.getElementById('sec-inner-costs'), renderCosts);

  setupScrollHighlight();

  // URL ?tab= による初期スクロール
  const initTab = UI.qs('tab');
  if (initTab) {
    const sec = document.getElementById('sec-' + initTab);
    if (sec) setTimeout(() => sec.scrollIntoView({ behavior: 'smooth', block: 'start' }), 150);
  }
}

(async () => {
  await Store.init();
  S = Store.session();
  isAdmin = S.role === 'admin';
  TABS = [['overview','概要'],['tasks','タスク'],['photos','写真'],['report','報告'],['contact','連絡']]
    .concat(isAdmin ? [['costs','原価']] : []);
  active = TABS.some(([k]) => k === active) ? active : 'overview';
  if (!isNew) CASE = await Store.getCase(UI.qs('id'));
  setHeader(); renderTabs();
  if (isNew) { if (!isAdmin) { document.getElementById('main').innerHTML = '<div class="empty">権限がありません</div>'; return; }
    renderEditForm(); return; }
  if (!CASE) { document.getElementById('main').innerHTML = '<div class="empty">案件が見つかりません</div>'; return; }
  await renderAllSections();
})();
</script>
